name: Browser smoke test
on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "tests/**"
      - "js/**"
      - "supabase/**"
      - "catalog.json"
      - "config.js"
      - "data/karaoke-coverage.js"
      - "database-editor.html"
      - "database-editor.css"
      - "database-editor.js"
      - ".github/workflows/browser-smoke.yml"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start local web server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ken-server.log 2>&1 &
          sleep 3
      - name: Verify Ver.2 TK-only structure
        run: node tests/v2-structure.mjs
      - name: Verify unconfigured authentication is fail-closed
        run: node tests/shared-guard.mjs
      - name: Verify shared UI (mock Supabase)
        run: node tests/shared-mock.mjs
      - name: Run administrator editor browser test
        run: node tests/editor-smoke.mjs
