name: Build MusicBrainz catalog to one million
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_musicbrainz_to_1m.py"
      - ".github/workflows/build-musicbrainz-1m.yml"
permissions:
  contents: write
concurrency:
  group: build-musicbrainz-1m
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install zstd streaming decoder
        run: python -m pip install --quiet zstandard>=0.23
      - name: Build verified MusicBrainz prefix-search buckets
        run: python scripts/build_musicbrainz_to_1m.py
      - name: Publish generated metadata index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/musicbrainz_700k/
          if ! git diff --cached --quiet; then
            git commit -m "Publish one million unique song search catalog"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "One-million record extension published"
                exit 0
              fi
              sleep 4
            done
            exit 1
          fi
