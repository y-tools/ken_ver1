name: Build two million songs with Japanese pronunciation
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_musicbrainz_to_2m.py"
      - ".github/workflows/build-musicbrainz-2m.yml"
permissions:
  contents: write
concurrency:
  group: ken-two-million-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install metadata decoder and Japanese reading converter
        run: python -m pip install --quiet "zstandard>=0.23" "pykakasi>=2.3,<3"
      - name: Build and validate 2M distinct songs and reading metadata
        run: python -u scripts/build_musicbrainz_to_2m.py
      - name: Verify generated files and publish atomically
        run: |
          python - <<'PY'
          import json, pathlib
          mb=json.loads(pathlib.Path("data/musicbrainz_next_1m/manifest.json").read_text(encoding="utf-8"))
          r=json.loads(pathlib.Path("data/song_readings/manifest.json").read_text(encoding="utf-8"))
          assert mb["targetUnique"]==2_000_000 and mb["additionalUnique"]==1_000_000
          assert mb["baselineUnique"]==1_000_000 and mb["bucketCount"]==256
          assert r["totalUnique"]==2_000_000 and r["bucketCount"]==256
          for manifest in [mb,r]:
            for file in manifest["files"]:
              assert pathlib.Path(file).is_file(),file
          print("Verified two million search records and pronunciation index")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/musicbrainz_next_1m/ data/song_readings/
          if ! git diff --cached --quiet; then
            git commit -m "Publish 2M song catalog and Japanese pronunciation search index"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Two million catalogue successfully published"
                exit 0
              fi
              sleep 4
            done
            exit 1
          fi
