name: Build 100k additional real-song search metadata
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_vocadb_100k.py"
      - ".github/workflows/build-vocadb-catalog.yml"
permissions:
  contents: write
concurrency:
  group: vocadb-catalog-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install streaming dataset downloader
        run: python -m pip install --quiet "huggingface_hub[hf_xet]>=0.31"
      - name: Build and validate additional 100k unique songs
        run: python scripts/build_vocadb_100k.py
      - name: Publish catalog shards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vocadb_100k/
          if ! git diff --cached --quiet; then
            git commit -m "Generate 100k deduplicated VocaDB song metadata records"
            # The repository can change during the dataset build.
            # Rebase the generated data-only commit onto the newest main branch.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Catalog shards published successfully"
                exit 0
              fi
              echo "Retrying catalog publish after concurrent main update ($attempt/5)"
              sleep 3
            done
            echo "Failed to publish catalog after five attempts" >&2
            exit 1
          fi
