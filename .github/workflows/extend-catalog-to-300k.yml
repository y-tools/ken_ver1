name: Extend song catalog to 300k unique records
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/extend_catalog_to_300k.py"
      - ".github/workflows/extend-catalog-to-300k.yml"
permissions:
  contents: write
concurrency:
  group: extend-song-catalog-300k
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install metadata downloader
        run: python -m pip install --quiet "huggingface_hub[hf_xet]>=0.31"
      - name: Generate validated catalog extension
        run: python scripts/extend_catalog_to_300k.py
      - name: Publish extension safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/extra_to_300k/
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified 300k unique song search catalog extension"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "300k song catalog shards published"
                exit 0
              fi
              echo "Retrying after concurrent repository update ($attempt/5)"
              sleep 3
            done
            echo "Could not publish catalog" >&2
            exit 1
          fi
