name: VPS database foundation tests
on:
  workflow_dispatch:
  push:
    paths:
      - "server/**"
      - "data/vps-search.js"
      - ".github/workflows/vps-db-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ken_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ken_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGPASSWORD: test
      KEN_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/ken_test
      KEN_IMPORT_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/ken_test
      KEN_ALLOWED_ORIGINS: https://y-tools.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: |
          python -m pip install --quiet -r server/requirements.txt httpx
          python -m compileall -q server
          node --check data/vps-search.js
      - name: Apply database schema to disposable PostgreSQL
        run: psql -h 127.0.0.1 -U postgres -d ken_test -v ON_ERROR_STOP=1 -f server/sql/001_init.sql
      - name: Import one small source file
        run: python server/import_catalog.py --dataset japanese --max-files 1 --batch-size 500
      - name: Run PostgreSQL search and pronunciation verification
        run: python -m unittest discover -s server/tests -p 'test_*.py' -v
