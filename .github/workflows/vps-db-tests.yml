name: VPS database foundation tests
on:
  workflow_dispatch:
  push:
    paths:
      - "server/**"
      - "data/vps-search.js"
      - ".github/workflows/vps-db-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ken_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ken_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGPASSWORD: test
      KEN_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/ken_test
      KEN_IMPORT_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/ken_test
      KEN_ALLOWED_ORIGINS: https://y-tools.github.io
      KEN_T008_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/ken_test
      KEN_T008_ALLOW_DISPOSABLE: "YES"
      KEN_T008_STAGE_LOGIN_DSN: postgresql://t008_stage_login:t008-ephemeral-test@127.0.0.1:5432/ken_test
      KEN_T008_REVIEW_LOGIN_DSN: postgresql://t008_review_login:t008-review-ephemeral@127.0.0.1:5432/ken_test
      KEN_T008_PUBLISH_LOGIN_DSN: postgresql://t008_publish_login:t008-publish-ephemeral@127.0.0.1:5432/ken_test
      KEN_T008_SEARCH_LOGIN_DSN: postgresql://t008_search_login:t008-search-ephemeral@127.0.0.1:5432/ken_test
      KEN_T008_UPGRADE_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/t008_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: |
          python -m pip install --quiet -r server/requirements.txt httpx
          python -m compileall -q server
          node --check data/vps-search.js
      - name: Apply database schema to disposable PostgreSQL
        run: psql -h 127.0.0.1 -U postgres -d ken_test -v ON_ERROR_STOP=1 -f server/sql/001_init.sql
      - name: Apply T008 isolated staging and hardening DDL
        run: |
          psql -h 127.0.0.1 -U postgres -d ken_test -v ON_ERROR_STOP=1 -f server/sql/004_t008_staging.sql
          psql -h 127.0.0.1 -U postgres -d ken_test -v ON_ERROR_STOP=1 -f server/sql/005_t008_constraints.sql
          psql -h 127.0.0.1 -U postgres -d ken_test -v ON_ERROR_STOP=1 -f server/sql/006_t008_review.sql
          psql -h 127.0.0.1 -U postgres -d ken_test -v ON_ERROR_STOP=1 -f server/sql/007_t008_roles_test.sql
          psql -h 127.0.0.1 -U postgres -d ken_test -v ON_ERROR_STOP=1 -f server/sql/008_t008_concurrency.sql
          psql -h 127.0.0.1 -U postgres -d ken_test -v ON_ERROR_STOP=1 -f server/sql/009_t008_integrity.sql
          psql -h 127.0.0.1 -U postgres -d ken_test -v ON_ERROR_STOP=1 -f server/sql/010_t008_b014.sql
          psql -h 127.0.0.1 -U postgres -d ken_test -v ON_ERROR_STOP=1 -f server/sql/011_t008_item_review.sql
          psql -h 127.0.0.1 -U postgres -d ken_test -v ON_ERROR_STOP=1 -f server/sql/012_t008_b016.sql
          psql -h 127.0.0.1 -U postgres -d ken_test -v ON_ERROR_STOP=1 -f server/sql/013_t008_b016_review.sql
          psql -h 127.0.0.1 -U postgres -d ken_test -v ON_ERROR_STOP=1 -f server/sql/014_t008_active_publication.sql
          psql -h 127.0.0.1 -U postgres -d ken_test -v ON_ERROR_STOP=1 -f server/sql/015_t008_b020.sql
          psql -h 127.0.0.1 -U postgres -d ken_test -v ON_ERROR_STOP=1 -f server/sql/016_t008_b022.sql
          psql -h 127.0.0.1 -U postgres -d ken_test -v ON_ERROR_STOP=1 -c "CREATE ROLE t008_stage_login LOGIN PASSWORD 't008-ephemeral-test'; GRANT t008_stage_writer TO t008_stage_login"
          psql -h 127.0.0.1 -U postgres -d ken_test -v ON_ERROR_STOP=1 -c "CREATE ROLE t008_review_login LOGIN PASSWORD 't008-review-ephemeral'; GRANT t008_reviewer TO t008_review_login; INSERT INTO t008_reviewer_principals(login_name,reviewer_id) VALUES ('t008_review_login','CI-REVIEWER-ROLE')"
          psql -h 127.0.0.1 -U postgres -d ken_test -v ON_ERROR_STOP=1 -c "CREATE ROLE t008_publish_login LOGIN PASSWORD 't008-publish-ephemeral'; GRANT t008_publisher TO t008_publish_login"
          psql -h 127.0.0.1 -U postgres -d ken_test -v ON_ERROR_STOP=1 -c "CREATE ROLE t008_search_login LOGIN PASSWORD 't008-search-ephemeral'; GRANT USAGE ON SCHEMA public TO t008_search_login; GRANT SELECT ON t008_visible_publications TO t008_search_login"
      - name: Import one small source file
        run: python server/import_catalog.py --dataset japanese --max-files 1 --batch-size 500
      - name: Initialize separate database editor audit schema
        run: psql -h 127.0.0.1 -U postgres -d ken_test -v ON_ERROR_STOP=1 -f server/sql/003_admin_editor.sql
      - name: Rehearse populated 014-to-015 upgrade without data loss
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE t008_test'
          for sql in 001_init 004_t008_staging 005_t008_constraints 006_t008_review 007_t008_roles_test 008_t008_concurrency 009_t008_integrity 010_t008_b014 011_t008_item_review 012_t008_b016 013_t008_b016_review 014_t008_active_publication; do
            psql -h 127.0.0.1 -U postgres -d t008_test -v ON_ERROR_STOP=1 -f "server/sql/${sql}.sql"
          done
          python -m server.t008_b022_upgrade_fixture before
          psql -h 127.0.0.1 -U postgres -d t008_test -v ON_ERROR_STOP=1 -f server/sql/015_t008_b020.sql
          psql -h 127.0.0.1 -U postgres -d t008_test -v ON_ERROR_STOP=1 -f server/sql/016_t008_b022.sql
          python -m server.t008_b022_upgrade_fixture after
      - name: Run PostgreSQL search and pronunciation verification
        run: python -m unittest discover -s server/tests -p 'test_*.py' -v
