<!doctype html><html lang="ja"><head><title>Kenのデンモク | リスナー新規登録</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="./js/auth-pages.css"><script src="./config.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="./js/shared.js" defer></script><script src="./js/auth-pages.js" defer></script></head><body data-auth-page="register"><main class="auth-card"><div class="eyebrow">KEN'S DENMOKU / VER.2</div><h1>リスナー新規登録</h1><form id="authForm"><label>表示名<input id="displayName" maxlength="40" autocomplete="nickname" required></label><label>ログインID（英小文字・数字・._-、4〜24文字、先頭は英字）<input id="loginId" minlength="4" maxlength="24" pattern="[A-Za-z][A-Za-z0-9._-]{3,23}" autocomplete="username" autocapitalize="off" spellcheck="false" required></label><label>メールアドレス（登録確認・パスワード再設定に使用）<input id="email" type="email" autocomplete="email" required></label><label>パスワード（8文字以上）<input id="password" minlength="8" type="password" autocomplete="new-password" required></label><button type="submit">メール認証して登録</button></form><p><a href="./login.html">ログインへ戻る</a></p><p id="feedback" role="status" aria-live="polite"></p></main></body></html>
